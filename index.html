<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney's Frozen the Musical at Western Wyoming College</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --licensed-dark-blue: rgb(23, 24, 70);
            --licensed-ice-blue: rgb(133, 206, 228);
            --licensed-cyan: rgb(0, 174, 239);
            --snow-white: #ffffff;
            --card-bg: rgba(23, 24, 70, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #02040a;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .snow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: var(--snow-white);
            font-size: 1rem;
            opacity: 0.4;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(23, 24, 70, 0.3) 0%, rgba(0, 174, 239, 0.12) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            z-index: 20;
            position: relative;
        }

        .tab-btn {
            background: rgba(23, 24, 70, 0.85);
            border: 1px solid rgba(133, 206, 228, 0.25);
            color: var(--licensed-ice-blue);
            padding: 12px 24px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--licensed-cyan);
            color: var(--licensed-dark-blue);
            box-shadow: 0 0 20px rgba(0, 174, 239, 0.35);
            border-color: var(--licensed-cyan);
        }

        .display-panel {
            background: var(--card-bg);
            border: 1px solid rgba(133, 206, 228, 0.2);
            box-shadow: 0 0 60px rgba(23, 24, 70, 0.95);
            width: 100%;
            max-width: 650px;
            min-height: 560px;
            padding: 45px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(15px);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            flex-grow: 1;
        }

        .tab-content.active {
            display: flex;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-block { text-align: center; margin-bottom: 10px; }
        
        .presenter { 
            color: var(--licensed-cyan); 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            font-weight: 900; 
            margin-bottom: 4px; 
        }
        
        .venue { 
            color: var(--licensed-ice-blue); 
            font-size: 0.9rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.9; 
            font-weight: 400;
        }

        .legal-notice-string {
            font-size: 0.58rem;
            color: var(--licensed-ice-blue);
            opacity: 0.5;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        
        .key-art-horizontal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin: 15px 0;
        }

        .elsa-silhouette-horizontal {
            width: 90px;
            height: 110px;
            flex-shrink: 0;
        }

        .elsa-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(133, 206, 228, 0.5));
        }

        .title-treatment {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .disney-credit {
            color: var(--licensed-ice-blue);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: -1px;
            font-weight: 700;
        }

        .main-title {
            color: var(--snow-white);
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: -1px;
        }

        .sub-title {
            color: var(--licensed-cyan);
            font-size: 0.75rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-top: 3px;
            font-weight: 700;
            position: relative;
        }

        .sub-title::after {
            content: '©';
            font-size: 0.55rem;
            position: absolute;
            right: -10px;
            top: -2px;
            color: var(--licensed-ice-blue);
        }

        .billing-credits-box {
            text-align: center;
            margin: 10px 0;
            font-size: 0.75rem;
            color: var(--licensed-ice-blue);
            line-height: 1.4;
        }
        .billing-title { font-weight: 700; text-transform: uppercase; font-size: 0.65rem; color: var(--licensed-cyan); letter-spacing: 1px; }

        .countdown-container {
            background: rgba(23, 24, 70, 0.7);
            border: 1px solid rgba(133, 206, 228, 0.15);
            padding: 12px;
            text-align: center;
            border-radius: 2px;
            margin: 12px 0;
        }

        .countdown-label {
            color: var(--licensed-ice-blue);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .countdown-digits {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            min-width: 55px;
        }

        .number {
            color: var(--snow-white);
            font-size: 1.6rem;
            font-weight: 900;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0, 174, 239, 0.3);
        }

        .time-unit {
            color: var(--licensed-ice-blue);
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 1px;
            letter-spacing: 1px;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .cast-member {
            background: rgba(133, 206, 228, 0.04);
            border: 1px solid rgba(133, 206, 228, 0.12);
            padding: 14px 18px;
            border-radius: 2px;
        }

        .role-title { 
            color: var(--licensed-cyan); 
            font-weight: 700; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }
        
        .actor-name { 
            color: var(--snow-white); 
            font-size: 1.15rem; 
            margin-top: 3px; 
            font-weight: 400; 
        }

        .scroll-box {
            max-height: 310px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .scroll-box::-webkit-scrollbar { width: 4px; }
        .scroll-box::-webkit-scrollbar-thumb { background: var(--licensed-cyan); }

        .char-item { margin-bottom: 20px; }
        .char-name { color: var(--licensed-cyan); font-size: 1.1rem; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .char-desc { color: var(--licensed-ice-blue); font-size: 0.9rem; line-height: 1.55; opacity: 0.95; }

        .footer-details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(133, 206, 228, 0.15);
            padding-top: 20px;
            margin-top: auto;
        }

        .info-block { display: flex; flex-direction: column; }
        .label { color: var(--licensed-cyan); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; font-weight: 700; }
